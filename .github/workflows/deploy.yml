name: Deploy (Cloudflare Pages)

# Baut die Website und lädt sie per Direct Upload zu Cloudflare Pages hoch.
# - Push auf main          → Produktion
# - Pull Request           → Vorschau-Adresse (<branch>.<projekt>.pages.dev, immer noindex)
#
# Benötigte Repository-Secrets (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN   Token mit NUR "Account → Cloudflare Pages → Edit" (Konto der Kundin, mit Ablaufdatum)
#   CLOUDFLARE_ACCOUNT_ID  Konto-ID aus dem Cloudflare-Dashboard (rechte Spalte "Account ID")
# Optionale Repository-Variable:
#   CF_PAGES_PROJECT       Name des Pages-Projekts (Standard: cilem-website)
# Fehlen die Secrets, wird nur gebaut, nicht deployt (kein roter Fehler).

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read
  deployments: write
  pull-requests: write

env:
  PROJECT: ${{ vars.CF_PAGES_PROJECT || 'cilem-website' }}
  BRANCH: ${{ github.head_ref || github.ref_name }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci

      - name: Website bauen
        run: npm run build
        env:
          # Gleiche Variable wie bei Cloudflares Git-Builds: steuert noindex für Vorschauen
          CF_PAGES_BRANCH: ${{ env.BRANCH }}
          PUBLIC_GA4_ID: ${{ vars.PUBLIC_GA4_ID }}
          PUBLIC_FORM_ENDPOINT: ${{ vars.PUBLIC_FORM_ENDPOINT }}
          PUBLIC_GSC_VERIFICATION: ${{ vars.PUBLIC_GSC_VERIFICATION }}
          PUBLIC_SITE_URL: ${{ vars.PUBLIC_SITE_URL }}

      - name: Sind Cloudflare-Secrets hinterlegt?
        id: secrets
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$TOKEN" ] && [ -n "$ACCOUNT" ]; then echo "ok=true" >> "$GITHUB_OUTPUT"
          else echo "ok=false" >> "$GITHUB_OUTPUT"; echo "::notice::Cloudflare-Secrets fehlen – Build ok, Deploy übersprungen."; fi

      - name: Pages-Projekt anlegen (nur beim ersten Mal)
        if: steps.secrets.outputs.ok == 'true'
        continue-on-error: true
        run: npx --yes wrangler@4 pages project create "$PROJECT" --production-branch=main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Zu Cloudflare Pages hochladen
        id: deploy
        if: steps.secrets.outputs.ok == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy website/dist --project-name=${{ env.PROJECT }} --branch=${{ env.BRANCH }} --commit-dirty=true

      - name: Vorschau-Link im Pull Request posten
        if: steps.secrets.outputs.ok == 'true' && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          URL: ${{ steps.deploy.outputs.deployment-url }}
          ALIAS: ${{ steps.deploy.outputs.pages-deployment-alias-url }}
        with:
          script: |
            const body = `**Vorschau:** ${process.env.ALIAS || process.env.URL}\n\n(Diese Adresse ist für Suchmaschinen gesperrt.)`;
            await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body });
